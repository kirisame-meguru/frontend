# [remnawave-fork] Build the per-user-per-inbound frontend and publish the zip the backend image consumes.
# Produces remnawave-frontend.zip and (re)uploads it to a release tagged `perinbound`, which the
# backend fork's Dockerfile FRONTEND_URL points at. Uses the built-in GITHUB_TOKEN.
#
# The @remnawave/backend-contract dependency is BUILT FROM SOURCE here (checked out from the backend
# fork) instead of relying on a hand-packed vendor/*.tgz. A contract change on the backend fork's
# feature branch therefore ships into the frontend automatically — no local `npm pack` step.
name: fork-frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Branch carrying the feature on every fork; the backend contract source is taken from here.
      FORK_BRANCH: main
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # [remnawave-fork] Pull the backend fork only for libs/contract (the contract source of truth).
      # Same owner + built-in GITHUB_TOKEN, so no extra secret is needed for a public fork.
      - name: Checkout backend fork (contract source)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/backend
          ref: ${{ env.FORK_BRANCH }}
          path: .backend-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # [remnawave-fork] Build the contract and refresh vendor/*.tgz from it. The packed filename is
      # remnawave-backend-contract-<version>.tgz and must match the "file:vendor/..." spec in
      # package.json (currently 3.4.3); bump both together if the contract version changes.
      - name: Build & vendor @remnawave/backend-contract
        run: |
          set -euo pipefail
          ( cd .backend-src/libs/contract && npm install && npm run build )
          # vendor/*.tgz is gitignored (.gitignore `*.tgz`), so vendor/ usually does NOT exist in a
          # fresh checkout — and `npm pack --pack-destination` does not create it, it ENOENTs on the
          # target path. Create it explicitly.
          mkdir -p vendor
          rm -f vendor/remnawave-backend-contract-*.tgz
          npm pack ./.backend-src/libs/contract --pack-destination ./vendor
          echo "Vendored:" && ls -l vendor/remnawave-backend-contract-*.tgz

      # The freshly packed tgz has a new integrity hash; both `npm ci` AND `npm install` enforce the
      # `integrity` pinned in package-lock.json for `file:` deps and hard-fail (EINTEGRITY). Drop the
      # stale integrity for just @remnawave/backend-contract so npm recomputes it from the new tgz;
      # every other dep stays locked.
      - name: Install deps (re-derive contract integrity)
        run: |
          node -e "const f='package-lock.json',j=require('./'+f);for(const k of Object.keys(j.packages||{}))if(k.endsWith('@remnawave/backend-contract'))delete j.packages[k].integrity;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npm install

      - run: npm run start:build

      - name: Zip dist
        run: zip -r remnawave-frontend.zip ./dist

      - name: Publish to `perinbound` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: perinbound
          prerelease: true
          files: remnawave-frontend.zip
